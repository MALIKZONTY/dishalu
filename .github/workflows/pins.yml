# Publishes scheduled Pinterest pins. Pinterest's API can't schedule, so this runs every 30 minutes
# and posts whatever in pins/queue.json is due. What it has published is recorded in published.json
# on the pin-log branch, so the robot never commits to main.
# Keys come from the repository secrets; set them from your Mac with `npm run pin -- secrets`.
name: Publish scheduled pins

on:
  schedule:
    # Minutes 7 and 37 of every hour from 00:07 to 16:37 UTC = 5:37 AM to 10:07 PM IST.
    # GitHub often starts these 5–30 minutes late.
    - cron: '7,37 0-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Get the publish log
        run: |
          if git fetch --quiet origin pin-log:pin-log 2>/dev/null; then
            git worktree add --quiet .pin-log pin-log
          else
            git worktree add --quiet --orphan -b pin-log .pin-log
          fi

      - name: Is anything due?
        id: check
        run: |
          node -e "
            const fs = require('fs');
            const queue = fs.existsSync('pins/queue.json') ? JSON.parse(fs.readFileSync('pins/queue.json', 'utf8')) : [];
            const log = fs.existsSync('.pin-log/published.json') ? JSON.parse(fs.readFileSync('.pin-log/published.json', 'utf8')) : {};
            const due = queue.some((p) => !log[p.id] && Date.parse(p.at) <= Date.now() && Date.now() - Date.parse(p.at) < 24 * 3600e3);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'due=' + due + '\n');
            console.log(due ? 'There are pins to publish.' : 'Nothing due.');
          "

      - uses: actions/setup-node@v4
        if: steps.check.outputs.due == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.due == 'true'
        run: npm ci

      - name: Publish due pins
        if: steps.check.outputs.due == 'true'
        run: node scripts/pin.mjs publish-due
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      # Runs even if publishing failed part-way, so pins already posted are never posted twice.
      - name: Save the publish log
        if: always() && steps.check.outputs.due == 'true'
        working-directory: .pin-log
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="dishalu-pins" -c user.email="pins@dishalu.in" commit --quiet -m "Publish log update [CF-Pages-Skip]"
            git push --quiet origin pin-log
          fi
